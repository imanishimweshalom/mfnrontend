
<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <meta
    name="theme-color"
    content="#c0392b"
  />

  <!-- Primary SEO -->
  <meta
    name="description"
    content="Mahoko Friday News ni urubuga rw'amakuru agezweho mu Rwanda no ku isi. Dutangaza inkuru z'ukuri muri Business, Sport, Technology, Health, Education, Culture, Entertainment, Music n'izindi."
  />

  <meta
    name="author"
    content="Mahoko Friday News"
  />

  <!-- Prevent indexing problems -->
  <meta
    name="robots"
    content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
  />

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="%PUBLIC_URL%/mahokon.jfif"
  />

  <link
    rel="apple-touch-icon"
    href="%PUBLIC_URL%/mahokon.jfif"
  />

  <!-- Canonical homepage -->
  <link
    rel="canonical"
    href="https://mahokofridaynews.com/"
  />

  <!-- Open Graph -->
  <meta
    property="og:site_name"
    content="Mahoko Friday News"
  />

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:title"
    content="Mahoko Friday News | Amakuru Agezweho"
  />

  <meta
    property="og:description"
    content="Amakuru agezweho mu Rwanda no ku isi. Ukuri, ubwisanzure n'inkuru zifite icyo zisobanuye."
  />

  <meta
    property="og:url"
    content="https://mahokofridaynews.com/"
  />

  <meta
    property="og:image"
    content="%PUBLIC_URL%/Gemini_Generated_Image_jzz77ojzz7.png"
  />

  <!-- Twitter / X -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="Mahoko Friday News | Amakuru Agezweho"
  />

  <meta
    name="twitter:description"
    content="Rwanda's youth news platform. Amakuru, ubusesenguzi n'inkuru zigezweho."
  />

  <meta
    name="twitter:image"
    content="%PUBLIC_URL%/Gemini_Generated_Image_jzz77ojzz7.png"
  />

  <!-- PWA -->
  <link
    rel="manifest"
    href="%PUBLIC_URL%/manifest.json"
  />

  <!-- Default title -->
  <title>
    Mahoko Friday News | Amakuru Agezweho mu Rwanda no ku Isi
  </title>

  <!-- Organization structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "NewsMediaOrganization",
    "name": "Mahoko Friday News",
    "url": "https://mahokofridaynews.com/",
    "logo": "https://mahokofridaynews.com/mahokon.jfif"
